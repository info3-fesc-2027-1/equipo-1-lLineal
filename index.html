
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taller Mecánico | Equipo 1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <!-- Botón para abrir el menú -->
<button id="btn-menu" class="btn-menu">
    ☰
</button>



<!-- Fondo oscuro -->
<div id="overlay" class="overlay"></div>

<!-- Menú lateral -->
<aside id="sidebar" class="sidebar">

    <h2>Taller Mecánico</h2>

    <nav>
        <a href="#registro">🏠  Inicio</a>
        <a href="./pedidos.html" class="menu-link">📋 Pedidos</a>
        <a href="#DASHLIVE"> 📊📈 DASHLIVE</a>

    </nav>

</aside>

<!-- HERO  inicio -->
<section class="hero" id="inicio">
  <div class="hero__etiqueta">
    <img src="/logo.svg" alt="Logo de Taller Morales">
    <span>ChēNova</span>
  </div>
    <p class="hero__texto">
      <span class="linea">El Esfuerzo De Hoy</span>
      <span class="linea">Es El Éxito De Mañana</span>
    </p>
    <a href="#registro" class="boton"><span class="boton__texto">Entrar</span></a>
</section>

  <main class="contenedor">

    <!-- REGISTRO DE CLIENTES -->
    <section class="clientes" id="registro">
      <h1>Registro de clientes</h1>
      <p>Ingresa los datos del cliente y su vehículo.</p>

      <form id="form-cliente" novalidate>
        <div class="campos">

          <div class="campo">
            <label for="nombre">Nombre completo *</label>
            <input type="text" id="nombre" name="nombre"
              placeholder="Ej. Juan Pérez" required>
                  <p id="error-nombre" class="error-campo"></p>
          </div>

          <div class="campo">
            <label for="telefono">Teléfono *</label>
            <input type="tel" id="telefono" name="telefono"
              placeholder="10 dígitos" maxlength="10"
              inputmode="numeric" required>
          <p id="error-telefono" class="error-campo"></p>
          </div>


          <div class="campo">
            <label for="placas">Placas del vehículo *</label>
            <input type="text" id="placas" name="placas"
              placeholder="Ej. ABC-123-D" maxlength="10"
              required>
              <p id="error-placas" class="error-campo"></p>
          </div>

                    <div class="campo">
            <label for="vehiculo">Vehículo *</label>
            <input type="text" id="vehiculo" name="vehiculo"
              placeholder="Ej. Nissan Versa 2022" required>
              <p id="error-vehiculo" class="error-campo"></p>
          </div>
          
                    <div class="campo">
            <label for="placas">FECHA RECIBIDO*</label>
            <input type="text" id="fecharecibido" name="fecharecibido"
              placeholder="Ej. 12-07-2026" maxlength="10"
              required>
              <p id="error-fecharecibido" class="error-campo"></p>
          </div>

                              <div class="campo">
            <label for="placas">FECHA ENTREGA*</label>
            <input type="text" id="fechaentrega" name="fechaentrega"
              placeholder="Ej. 12-08-2026" maxlength="10"
              required>
              <p id="error-fechaentrega" class="error-campo"></p>
          </div>


          <div class="campo completo">
            <label for="observaciones">Observaciones</label>
            <textarea id="observaciones" name="observaciones"
              rows="3" placeholder="Información adicional"></textarea>
          </div>

        </div>

        <button type="submit">Registrar cliente</button>
        <button type="reset" class="btn-limpiar">Limpiar</button>

        <p id="mensaje-cliente" role="status" aria-live="polite"></p>
      </form>
    </section>

<!-- CATÁLOGO DE SERVICIOS -->
<section class="seccion-servicios">
  <h1>Servicios del taller</h1>
  <p>Selecciona los servicios que necesita el vehículo.</p>
      <div class="mb-6">

      <input
         id="buscador"
         type="text"
         placeholder="Buscar producto..."
         class="w-full max-w-md mx-auto block px-4 py-2 border rounded-lg
                 bg-white text-gray-900
                dark:bg-gray-800 dark:text-white
                dark:border-gray-600"
    >

    </div>

  <div id="catalogo" class="catalogo-servicios"></div>
</section>

    <!-- PEDIDO -->
    <section class="pedido">
      <h2>Mi pedido</h2>

      <ul id="lista-pedido"></ul>

      <p id="total">Total: $0.00</p>

      <button type="button" id="btn-vaciar" class="btn-vaciar">
        Vaciar pedido
      </button>
    </section>

  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
